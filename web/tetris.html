<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<link rel="stylesheet" href="tetris.css">
</head>
<body>
<h1>TETRIS</h1>
<div id="game">
  <div id="boardWrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">PAUSED<br><span style="font-size:12px">press P</span></div>
  </div>
  <div id="side">
    <div class="box">
      <h2>SCORE</h2>
      <p id="score">0</p>
    </div>
    <div class="box">
      <h2>LINES</h2>
      <p id="lines">0</p>
    </div>
    <div class="box">
      <h2>LEVEL</h2>
      <p id="level">1</p>
    </div>
    <div class="box">
      <h2>NEXT</h2>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="box" id="help">
      ← → move &nbsp; ↑ rotate<br>
      ↓ soft drop &nbsp; SPACE: drop<br>
      P: pause
    </div>
  </div>
</div>

<script src="tetris.js"></script>
</body>
</html>
