# Best Flash-Next Zig build (2026-10-30, variants/tf119d): TensorFold 1.1.9 + our Flash-Next patch, the mixed pass,
# MiaAI-Lab's sampled drafts (0007, 0008, 0011), resident prompt states, the fill scheduler, the reply read-out and
# one-launch attention and DeltaNet for a round's lanes, Python's prompt GEMM for lone chunks. Start it with benchmarks/tensorfold-zig-117-20261027/up-117.sh, which supplies the
# patch digest; tests and results: benchmarks/tensorfold-zig-117-20261027/REPORT.md.
# 16 streams, 75k context, fp8 (int8-row) KV, MTP6/0.60, vision and an elastic RAM prompt cache.
# TF_FLASHNEXT_MIXED=1 runs a prompt chunk and the decode round in one pass, experts read once; 0: apart.
# Requires the prepared build volume and codec volume; never silently downloads/rebuilds.
# Persistent memory/learning remains disabled. Test port is loopback only.
# Served model: TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
name: ieti-qwen38-flash-next-tensorfold-best
services:
  qwen-tensorfold-best:
    image: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
    platform: linux/arm64
    pull_policy: missing
    labels:
      com.ieti.inference: "true"
      com.ieti.profile: "qwen38-flash-next-tensorfold-117-mlx-4bit-vision-128gb-best.yml"
    container_name: qwen38_flash_next_tensorfold_best_cuda
    restart: ${TENSORFOLD_RESTART:-no}
    init: true
    stop_grace_period: 60s
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${TENSORFOLD_BIND_ADDRESS:-127.0.0.1}:${TENSORFOLD_BIND_PORT:-8007}:8000"
    volumes:
      - upstream-runtime:/opt/ieti-tf116:ro
      - jpeg-runtime:/opt/ieti-tf114:ro
      - patched-runtime:/opt/ieti-native116:ro
      - checkpoint-cache:/root/.cache/huggingface:ro
    environment:
      MODEL_ID: "${TENSORFOLD_MODEL_ID:-TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP}"
      MODEL_REVISION: "${TENSORFOLD_MODEL_REVISION:-2b170fa6309d5d1ee380b35636075fac7945f286}"
      NATIVE_BINARY: /opt/ieti-native116/install/native/bin/tensorfold-native
      TF_PLE_PATCH_SHA256: "${TENSORFOLD_NATIVE_PATCH_SHA256:?the build volume patch digest}"
      TF_FLASHNEXT_PLE_BATCH: "${TF_FLASHNEXT_PLE_BATCH:-1}"
      # 1.1.6's grammar library; 1.1.4's runtime only for libturbojpeg (vision), which 1.1.6's archive no longer ships
      LD_LIBRARY_PATH: /opt/ieti-tf116/tensorfold-1.1.6-linux-aarch64/lib:/opt/ieti-tf114/tensorfold-1.1.4-linux-aarch64/lib
      CONTEXT_LENGTH: "${TENSORFOLD_CONTEXT:-75000}"
      PARALLEL_STREAMS: "${TENSORFOLD_STREAMS:-16}"
      TENSORFOLD_MEMORY_RESERVE_GIB: "${TENSORFOLD_RESERVE_GIB:-10}"
      TENSORFOLD_PROMPT_CACHE_GIB: "${TENSORFOLD_PROMPT_CACHE_GIB:-24}"
      TENSORFOLD_NO_UPDATE_CHECK: "1"
      TENSORFOLD_CUDA_KERNELS: native
      TF_FLASHNEXT_DRAFTS: "${TENSORFOLD_DRAFT_DEPTH:-6}"
      # Prompt chunk rows while nothing decodes; TF_FLASHNEXT_LIVE_CHUNK caps them while replies decode.
      TF_FLASHNEXT_CHUNK: "${TENSORFOLD_PREFILL_CHUNK:-4096}"
      TF_FLASHNEXT_LIVE_CHUNK: "${TF_FLASHNEXT_LIVE_CHUNK:-4096}"
      DRAFTS_ENABLED: "${TENSORFOLD_DRAFTS_ENABLED:-1}"
      VISION_ENABLED: "${TENSORFOLD_VISION_ENABLED:-1}"
      TF_FLASHNEXT_CONFIDENCE: "${TF_FLASHNEXT_CONFIDENCE:-0.60}"
      # Prompt steps' share of wall time beside decoding streams (core lane host; 1: no limit).
      TENSORFOLD_PREFILL_SHARE: "${TENSORFOLD_PREFILL_SHARE:-1}"
      # Diagnostics only, off by default: per-pass wall times and draft depth histograms on stderr.
      TF_FLASHNEXT_PROFILE: "${TF_FLASHNEXT_PROFILE:-0}"
      TF_FLASHNEXT_DEPTH_LOG: "${TF_FLASHNEXT_DEPTH_LOG:-0}"
      TF_LANES_PHASES: "${TF_LANES_PHASES:-0}"
      TF_HOST_TRACE: "${TF_HOST_TRACE:-0}"
      TF_FLASHNEXT_PLE_ITEMS: "${TF_FLASHNEXT_PLE_ITEMS:-4}"
      TF_FLASHNEXT_PLE_PREAD: "${TF_FLASHNEXT_PLE_PREAD:-hybrid}"
      TF_FLASHNEXT_MANY_PROMPTS: "${TF_FLASHNEXT_MANY_PROMPTS:-1}"
      TF_HOST_SETTLE_MS: "${TF_HOST_SETTLE_MS:-3}"
      TF_FLASHNEXT_RECYCLE_MIB: "${TF_FLASHNEXT_RECYCLE_MIB:-2048}"
      # 1: a prompt chunk beside decoding streams rides their round, each layer's experts read once for both.
      TF_FLASHNEXT_MIXED: "${TF_FLASHNEXT_MIXED:-1}"
      # MiaAI-Lab 0007/0008/0011 (builds that have them): sampled streams in the batched draft pass, top_k candidates on the GPU,
      # host draws on worker threads. Replies unchanged; +8.5% at temperature 0.55. Builds without them ignore these.
      TF_FLASHNEXT_SAMPLED_HEADS: "${TF_FLASHNEXT_SAMPLED_HEADS:-1}"
      TF_FLASHNEXT_SAMPLE_CAND: "${TF_FLASHNEXT_SAMPLE_CAND:-1}"
      TF_FLASHNEXT_HOST_DRAW_THREADS: "${TF_FLASHNEXT_HOST_DRAW_THREADS:-4}"
      # 1: the prompt cache takes the memory streams leave as they run (up to the asked size), not what full windows leave.
      TF_PROMPT_CACHE_ELASTIC: "${TF_PROMPT_CACHE_ELASTIC:-1}"
      TF_PROMPT_CACHE_MARGIN_GIB: "${TF_PROMPT_CACHE_MARGIN_GIB:-2}"
      # Resident prompt states (builds that have them): with full windows a mark keeps the DeltaNet state and leaves its
      # attention rows in the stream's caches until the return turn; the floor resident states copy into.
      TF_PROMPT_CACHE_RESIDENT_GIB: "${TF_PROMPT_CACHE_RESIDENT_GIB:-2}"
      # Fill scheduler: the prompt nearest its end keeps the chunks (prompts finish one after another and decode while the
      # rest fill), and up to 8 long prompt steps run between decode rounds.
      TF_FILL_AGING_ROUNDS: "${TF_FILL_AGING_ROUNDS:-1000000}"
      TF_FILL_ROUND_STEPS: "${TF_FILL_ROUND_STEPS:-8}"
      # Reply rounds (up to 16 x 7 rows) keep the row read-out; its prompt tile is slower there. Bits are the same.
      TF_TILE_READOUT_ROWS: "${TF_TILE_READOUT_ROWS:-128}"
      # Builds before resident12 read all three thresholds from the first one asked (the read-out's 128): these keep
      # the measured behaviour now that each knob is its own.
      TF_TILE_EXPERTS_ROWS: "${TF_TILE_EXPERTS_ROWS:-128}"
      TF_TILE_MATMUL_ROWS: "${TF_TILE_MATMUL_ROWS:-128}"
      # Reply rounds' attention in one launch a kernel for every stream (each row finds its caches by table); 0: a
      # stream at a time. Bits are the same.
      TF_FLASHNEXT_ATTN_LANES: "${TF_FLASHNEXT_ATTN_LANES:-1}"
      # The same for the DeltaNet layers (copies, front, chain and window shift); 0: a stream at a time. Bits are the same.
      TF_FLASHNEXT_GDN_LANES: "${TF_FLASHNEXT_GDN_LANES:-1}"
      # fp8: Flash Next's attention caches as the Python engine's --kv-dtype int8 rows (H32 groups, fp16 scales), half the bytes.
      TENSORFOLD_KV_CACHE: "${TENSORFOLD_KV_CACHE:-fp8}"
      # Experiments: space-separated VAR=value pairs exported before the server starts (any engine knob, no profile edit).
      TF_EXTRA_ENV: "${TF_EXTRA_ENV:-}"
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        test "$$(cat /opt/ieti-native116/source-ready)" = "$${TF_PLE_PATCH_SHA256}"
        cd /opt/ieti-native116/install/native/bin
        sha256sum -c SHA256SUMS
        "$${NATIVE_BINARY}" --version
        if [ -n "$${TF_EXTRA_ENV}" ]; then export $${TF_EXTRA_ENV}; echo "extra env: $${TF_EXTRA_ENV}"; fi
        echo "TF_FLASHNEXT_MIXED=$${TF_FLASHNEXT_MIXED} CONFIDENCE=$${TF_FLASHNEXT_CONFIDENCE} LIVE_CHUNK=$${TF_FLASHNEXT_LIVE_CHUNK} PREFILL_SHARE=$${TENSORFOLD_PREFILL_SHARE}"
        MODEL_PATH="/root/.cache/huggingface/hub/models--$${MODEL_ID//\//--}/snapshots/$${MODEL_REVISION}"
        test -f "$$MODEL_PATH/config.json"
        options=()
        if [ "$${DRAFTS_ENABLED}" = 0 ]; then options+=(--no-drafts); fi
        if [ "$${VISION_ENABLED}" = 1 ]; then options+=(--vision --vision-max-images 1 --vision-image-tokens 4096); fi
        exec "$${NATIVE_BINARY}" serve "$$MODEL_PATH" \
          --host 0.0.0.0 --port 8000 --name "$${MODEL_ID}" \
          --context "$${CONTEXT_LENGTH}" --parallel "$${PARALLEL_STREAMS}" \
          --max-tokens 32768 --temperature 0.1 --top-p 0.95 --top-k 20 \
          --thinking --reasoning-effort low --thinking-budget 1024 \
          --prompt-cache-gib "$${TENSORFOLD_PROMPT_CACHE_GIB}" \
          --kv-cache "$${TENSORFOLD_KV_CACHE}" \
          "$${options[@]}" --no-update-check
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  patched-runtime:
    external: true
    name: ${TENSORFOLD_NATIVE_VOLUME:-ieti-native117-tf119d-build}
  upstream-runtime:
    external: true
    name: ieti-tensorfold-116-runtime
  jpeg-runtime:
    external: true
    name: ieti-tensorfold-114-runtime
  checkpoint-cache:
    external: true
    name: ${TENSORFOLD_CHECKPOINT_VOLUME:-ieti-qwen38-flash-next-tensorfold-mlx-4bit-mtp-int8-ssd-vision-128gb-hf-cache}
