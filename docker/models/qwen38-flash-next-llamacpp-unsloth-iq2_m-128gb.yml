# From docker/: docker compose -f models/qwen38-flash-next-llamacpp-unsloth-iq2_m-128gb.yml up -d
# Served model: unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ2_M
# Note:    Single-GB10 llama.cpp profile using Unsloth UD-IQ2_M GGUF.
#          Text-only: the separate vision projector is intentionally not loaded.

name: ieti-qwen38-flash-next-llamacpp-unsloth-iq2-m-128gb

services:
  qwen-llamacpp:
    image: local/llama.cpp:qwen38-dflash2-cuda13
    pull_policy: missing
    labels:
      com.ieti.inference: "true"
      com.ieti.profile: "qwen38-flash-next-llamacpp-unsloth-iq2_m-128gb.yml"
    container_name: qwen38_flash_next_cuda_vram128_llamacpp_unsloth_ud_iq2_m_8k

    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp

    volumes:
      - type: bind
        source: ../tokens.env
        target: /run/secrets/tokens.env
        read_only: true
        bind:
          create_host_path: false
      - xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-gguf-cache:/root/.cache/llama.cpp

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45m

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -lc

    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi
        exec /app/llama-server \
          -hf unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ2_M \
          --alias unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ2_M \
          --host 0.0.0.0 \
          --port 8000 \
          --log-timestamps \
          --log-prefix \
          -c 8192 \
          -ngl 99 \
          -np 1 \
          -fa on \
          -ctk q8_0 \
          -ctv q8_0 \
          --reasoning on

volumes:
  xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-hf-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-hf-cache

  xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-gguf-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-ud-iq2-m-8k-gguf-cache
