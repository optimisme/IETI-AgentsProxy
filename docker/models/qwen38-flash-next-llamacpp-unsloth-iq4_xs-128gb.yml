# From docker/: docker compose -f models/qwen38-flash-next-llamacpp-unsloth-iq4_xs-128gb.yml up -d
# Served model: unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS
#
# Note:    Qwen3.8-Flash-Next Unsloth UD-IQ4_XS GGUF.
#          Target: NVIDIA DGX Spark / GB10 with 128 GB unified memory.
#          64k total context shared across four parallel slots.
#          No MTP sidecar: this profile is intended for concurrent serving.

name: ieti-qwen38-flash-next-llamacpp-unsloth-iq4-xs-128gb

services:
  qwen-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: always
    labels:
      com.ieti.inference: "true"
      com.ieti.profile: "qwen38-flash-next-llamacpp-unsloth-iq4_xs-128gb.yml"
    container_name: qwen38_flash_next_cuda_vram128_llamacpp_unsloth_iq4_xs_64k_image

    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - LLAMA_CACHE=/root/.cache/llama.cpp
      - CUDA_VISIBLE_DEVICES=0

    volumes:
      - type: bind
        source: ../tokens.env
        target: /run/secrets/tokens.env
        read_only: true
        bind:
          create_host_path: false
      - xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-llama-cache:/root/.cache/llama.cpp

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 45m

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    entrypoint:
      - /bin/bash
      - -lc

    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a

        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        exec /app/llama-server \
          --hf-repo unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS \
          --alias unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS \
          --host 0.0.0.0 \
          --port 8000 \
          --ctx-size 65536 \
          --parallel 4 \
          --n-gpu-layers all \
          --n-cpu-moe 44 \
          --flash-attn on \
          --batch-size 2048 \
          --ubatch-size 512 \
          --cache-type-k q8_0 \
          --cache-type-v q8_0 \
          --jinja \
          --reasoning-format deepseek

volumes:
  xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-hf-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-hf-cache

  xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-llama-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-llamacpp-unsloth-iq4_xs-64k-llama-cache
