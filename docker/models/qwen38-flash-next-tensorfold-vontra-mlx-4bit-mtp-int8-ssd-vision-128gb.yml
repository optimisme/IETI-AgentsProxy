# From docker/: docker compose -f models/qwen38-flash-next-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-128gb.yml up -d
# Served model: Vontra/Qwen3.8-Flash-Next-MLX-4bit-MTP
# TensorFold v0.6.1, pinned to its official release commit.
# Flash-Next CUDA vision is upstream through PR #146.
# Custom startup patch: TENSORFOLD_PROMPT_SNAPSHOTS defaults to 16 (integer 1–32).
# This is retained text-prefix snapshots, not a limit of sixteen conversations.
# Extra retention consumes memory; vision requests bypass text-prefix reuse.
# KEEP is patched before pip install, for both memory planning and runtime use;
# the installed module is verified before serving. No CUDA/image rebuild is needed.
# CUDA on one ARM64 DGX Spark / GB10, internal MTP drafting and native vision.
# Default profile: sixteen concurrent streams, 75000 tokens per stream, int8 KV
# and SSD n-gram reads.
# Thinking stays enabled with low reasoning effort and a 1024-token budget,
# preserving the rest of the reply allowance for answers and tool calls.
# Temperature 0.1 reduces sampling randomness. Requests can override defaults.
# Upstream reserves 4 GiB of vision workspace at startup; runtime cache growth
# normally keeps 2 GiB of headroom, without the old patch's extra vision guard.
# Reuses the existing Flash Next HF cache volume; it must already exist.
# Runtime and compiled-kernel caches are separate from the text-only profile.
# Optional five-stream / 262k configuration from docker/ (not validated here):
# TENSORFOLD_CONTEXT=262144 TENSORFOLD_STREAMS=5 docker compose -f models/qwen38-flash-next-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-128gb.yml up -d
# Release adds shared text-prefix reuse and short-prompt-first prefill scheduling.
# Paired CUDA validation 2026-10-02 against the unchanged old control passed:
# text/SSE, conversation, shared-prefix reuse, two-image cache isolation, MTP,
# 1/4/8/16 streams, mixed 8-image + 8-text bursts and 2k/8k/16k/32k prefills.
# Shared-prefix and short-request admission improved; decode speedups were not
# established. Cold overlapping 4x16k prefills still exceeded 10s TTFT.
# With vision enabled, upstream uses 2048-row idle prefill pieces, not 4096.
# All sixteen full 75k windows at once remain unverified.
# The checkpoint download is about 114 GB; leave at least 160 GB free disk.
# Do not run alongside another large model on a 128 GB Spark.
# Sources: https://github.com/ashhart/TensorFold/releases/tag/v0.6.1
#          https://github.com/ashhart/TensorFold/pull/146

name: ieti-qwen38-flash-next-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-128gb

services:
  qwen-tensorfold:
    image: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
    platform: linux/arm64
    pull_policy: missing
    labels:
      com.ieti.inference: "true"
      com.ieti.profile: "qwen38-flash-next-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-128gb.yml"
    container_name: qwen38_flash_next_cuda_vram128_tensorfold_vontra_mlx_4bit_mtp_int8_ssd_vision
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ../tokens.env
        target: /run/secrets/tokens.env
        read_only: true
        bind:
          create_host_path: false
      - xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-runtime-cache:/root/.cache/tensorfold
      - xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-kernel-cache:/root/.cache/tensorfold-kernels
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      PIP_CACHE_DIR: /root/.cache/tensorfold/pip
      TORCH_EXTENSIONS_DIR: /root/.cache/tensorfold-kernels/torch-extensions
      TRITON_CACHE_DIR: /root/.cache/tensorfold-kernels/triton
      CUDA_CACHE_PATH: /root/.cache/tensorfold-kernels/cuda
      MAX_JOBS: "2"
      PYTHONUNBUFFERED: "1"
      TENSORFOLD_NO_LIVE: "1"
      TENSORFOLD_NO_UPDATE_CHECK: "1"
      MODEL_ID: Vontra/Qwen3.8-Flash-Next-MLX-4bit-MTP
      CONTEXT_LENGTH: "${TENSORFOLD_CONTEXT:-75000}"
      PARALLEL_STREAMS: "${TENSORFOLD_STREAMS:-16}"
      TENSORFOLD_PROMPT_SNAPSHOTS: "${TENSORFOLD_PROMPT_SNAPSHOTS:-16}"
    # Preserve NVIDIA's entrypoint and its CUDA compatibility initialization.
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        # Keep NVIDIA's PyTorch, Triton, CUDA libraries and extension compiler.
        # The venv is recreated with the container; only downloads and caches persist.
        python3 -m venv --system-site-packages /opt/tensorfold-venv
        . /opt/tensorfold-venv/bin/activate
        # Recreate the container-only checkout at the official v0.6.1 commit.
        rm -rf /opt/tensorfold-source
        git clone --filter=blob:none --no-checkout https://github.com/ashhart/TensorFold.git /opt/tensorfold-source
        git -C /opt/tensorfold-source checkout --detach 17c73e189f5e6a5304cda7ea37f086f9c49b4788
        # Custom setting, not an upstream CLI option. Fail if the pinned source drifts.
        python - /opt/tensorfold-source/src/tensorfold/families/qwen4_exp/cuda/engine.py <<'PY_PATCH_SNAPSHOTS'
        import os
        from pathlib import Path
        import re
        import sys

        value = os.environ['TENSORFOLD_PROMPT_SNAPSHOTS']
        if not re.fullmatch(r'[0-9]{1,2}', value) or not 1 <= int(value) <= 32:
            raise SystemExit('TENSORFOLD_PROMPT_SNAPSHOTS must be an integer from 1 to 32')
        path = Path(sys.argv[1])
        source = path.read_text()
        expected = 'KEEP = 8                 # prompt states (one token before each end) a concurrent decoder keeps to resume from'
        uses = (
            'indexed_stream_geometry(text, streams, each, KEEP, mtp=mtp, kv_bits=bits)',
            'confidence=self.confidence, keep=KEEP, points=self.points,',
        )
        if re.findall(r'^KEEP\s*=.*', source, re.MULTILINE) != [expected] or any(source.count(use) != 1 for use in uses):
            raise SystemExit('TensorFold snapshot patch failed: pinned engine.py KEEP=8 or its planning/runtime uses no longer match')
        path.write_text(source.replace(expected, expected.replace('KEEP = 8 ', f'KEEP = {int(value)} '), 1))
        print(f'[ieti] Patched Flash Next retained prompt snapshots: {int(value)}', flush=True)
        PY_PATCH_SNAPSHOTS
        # The test extra supplies pytest, also required by NGC's triton-kernels.
        python -m pip install \
          '/opt/tensorfold-source[test,vision]' \
          'transformers==5.18.0' 'huggingface-hub==1.33.0' \
          'hf-xet==1.6.0' 'pytest==9.1.1'

        # Ordinary pip copies the checkout: inspect/import the installed package too.
        python - /opt/tensorfold-source <<'PY_VERIFY_SNAPSHOTS'
        import importlib
        import inspect
        import os
        from pathlib import Path
        import sys

        engine = importlib.import_module('tensorfold.families.qwen4_exp.cuda.engine')
        installed = Path(engine.__file__).resolve()
        keep = getattr(engine, 'KEEP', None)
        expected = int(os.environ['TENSORFOLD_PROMPT_SNAPSHOTS'])
        source = inspect.getsource(engine)
        uses = (
            'indexed_stream_geometry(text, streams, each, KEEP, mtp=mtp, kv_bits=bits)',
            'confidence=self.confidence, keep=KEEP, points=self.points,',
        )
        if installed.is_relative_to(Path(sys.argv[1]).resolve()) or keep != expected or any(source.count(use) != 1 for use in uses):
            raise SystemExit(f'TensorFold installed snapshot verification failed: {installed}, KEEP={keep!r}, expected={expected}')
        print(f'[ieti] Verified installed Flash Next KEEP={keep}: {installed}', flush=True)
        PY_VERIFY_SNAPSHOTS

        # Flash Next includes its own MTP head; its n-gram tables stay on SSD.
        tensorfold pull "$${MODEL_ID}"
        exec tensorfold serve "$${MODEL_ID}" \
          --backend cuda \
          --host 0.0.0.0 \
          --port 8000 \
          --name "$${MODEL_ID}" \
          --context "$${CONTEXT_LENGTH}" \
          --parallel "$${PARALLEL_STREAMS}" \
          --thinking \
          --reasoning-effort low \
          --thinking-budget 1024 \
          --temperature 0.1 \
          --kv-dtype int8 \
          --ple-on-ssd \
          --vision \
          --mtp-drafts 6 \
          --mtp-confidence 0.60 \
          --no-update-check
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180m

volumes:
  xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-hf-cache:
    external: true
    name: xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-hf-cache
  xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-runtime-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-runtime-cache
  xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-kernel-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-tensorfold-vontra-mlx-4bit-mtp-int8-ssd-vision-kernel-cache
