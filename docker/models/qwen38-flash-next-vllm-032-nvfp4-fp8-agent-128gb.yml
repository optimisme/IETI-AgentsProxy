# Experimental: 16 slots x 75,000 total tokens. GPU campaign: 48/48 near-full
# text requests across 3 cohorts, with 16 overlapping output streams each,
# no OOM, preemptions or swap-out. Images passed separate PNG/JPEG smoke checks.
# vLLM 0.32.0; NVFP4 weights, FP8 main KV and indexer, FP32 recurrent states.
# Tested tuning candidate: chunk 8192, MTP off, GPU memory utilization 0.82,
# prefix matching at 32 tokens and shared checkpoints requested. The engine
# reports 16.82 full-context capacity. Tested total budgets reached 74,985.
# MTP3 stock profiles were faster but reported only 8.89-9.62 full contexts.
# Tuned short-code throughput was 52.32% below Python; do not promote this test
# profile as a performance upgrade. Full-length returning branches lost reuse.
# Initial stock-prefix results are preserved in the campaign's c2048-mtp3 folder.
# Mia's pinned mmap PLE storage adaptation is ported with exact source guards.
# Learning, saved conversations and disk prompt caching are not enabled.
# Run from docker/; local files are the source of truth and are synced together.
name: ieti-qwen38-vllm-032-fp8-agent
services:
  qwen-vllm:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    platform: linux/arm64
    pull_policy: missing
    container_name: qwen38_flash_next_vllm032_fp8_agent
    restart: "no"
    init: true
    ipc: host
    stop_grace_period: 60s
    mem_limit: 105g
    memswap_limit: 105g
    ports: ["127.0.0.1:8007:8000"]
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /root/.cache/vllm
      VLLM_PLE_MMAP_DIR: /root/.cache/vllm/ple_mmap_032
      VLLM_PLE_MMAP_ADVICE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      MAX_JOBS: "2"
      FLASHINFER_NVCC_THREADS: "1"
      MAX_NUM_SEQS: "16"
      MAX_NUM_BATCHED_TOKENS: "${VLLM_TEST_CHUNK:-8192}"
      GPU_MEMORY_UTILIZATION: "${VLLM_TEST_GMU:-0.82}"
      MTP_TOKENS: "${VLLM_TEST_MTP:-0}"
      SSM_CACHE_DTYPE: "${VLLM_TEST_SSM:-float32}"
      ENFORCE_EAGER: "${VLLM_TEST_EAGER:-0}"
      PREFIX_MATCH_UNIT: "${VLLM_TEST_PREFIX:-32}"
      MTP_DISABLE_BLOCK_DROP: "${VLLM_TEST_NO_DROP:-1}"
      SHARED_PREFIX_CHECKPOINT: "${VLLM_TEST_SHARED_PREFIX:-1}"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
      - vllm-runtime-cache:/root/.cache/vllm
      - ../benchmarks/vllm-fp8-agent-20261023/bootstrap.py:/opt/ieti/bootstrap.py:ro
    entrypoint: ["python3", "-u", "/opt/ieti/bootstrap.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60m
volumes:
  vllm-hf-cache:
    name: ieti-vllm032-flashnext-hf-cache
  vllm-runtime-cache:
    name: ieti-vllm032-flashnext-runtime-cache
