# Start: docker compose -f compose-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image.yml up -d --force-recreate
# Stop:  docker compose -f compose-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image.yml down
# Logs:  docker logs -f --tail 100 qwen38_flash_next_cuda_vram128_vllm_mia_nvfp4_mtp_64k_image
# Single 128GB DGX Spark / GB10, 64k per request, 8 concurrent sequences.
# Downloads the pinned MiaAI Lab Git project and applies its patches in-container.
# Fixed runtime: FP8 KV, MTP=3, native RoPE (YaRN off), automatic graph widths.
# Source: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark
# Adaptation: AGPL-3.0-or-later; upstream license retained in downloaded project.
# Needs ~130 GiB storage for weights/PLE, plus container image and runtime caches.
# No local build context, Python helper, Dockerfile, or patch folder is required.
# GPU startup, health/API, and 8 short concurrent chats validated on two GB10s, 2026-09-05.
# Full 64k concurrent load, sustained throughput, and FP8 quality remain untested.
# Reduced draft vocabulary is disabled (the upstream vocabulary is not shipped).
services:
  qwen-vllm:
    image: vllm/vllm-openai:qwen38-flash-next@sha256:fc120ece0a388cc0aa1caad4a9f1cd92113484ab7ec2fd0efadd62585be05bf8
    platform: linux/arm64
    pull_policy: missing
    container_name: qwen38_flash_next_cuda_vram128_vllm_mia_nvfp4_mtp_64k_image
    # A memory-watchdog stop must not automatically restart under the same pressure.
    restart: "no"
    init: true
    stop_grace_period: 60s
    ipc: host
    mem_limit: 100g
    memswap_limit: 100g
    cap_add:
      - SYS_NICE
      - SYS_PTRACE
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8000:8000"
    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-hf-cache:/root/.cache/huggingface
      - xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      VLLM_CACHE_ROOT: /root/.cache/vllm
      PYTHONUNBUFFERED: "1"
      MIA_RECIPE_REVISION: 09d4424be2b777818471b9bba8c7775ddd538833
      MIA_RECIPE_SHA256: eca839f2c3a8a954ef7afd4c658a312e6b144ccd409bf79af669edb7616f175e
      MODEL_ID: Mia-AiLab/Qwen3.8-Flash-Next-NVFP4
      MODEL_REVISION: 925d7be6c14c6c9442ef83e8f05b5a3c39304f69
      SERVED_MODEL_NAME: active-model
      MAX_MODEL_LEN: "65536"
      MAX_NUM_SEQS: "8"
      MAX_NUM_BATCHED_TOKENS: "2048"
      HOST_RESERVE_GIB: "26"
      KV_TARGET_GIB: "16"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_OFFLOAD_STEP_TIMEOUT: "300"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        # Cache and verify the pinned Git project inside the runtime volume.
        export UPSTREAM_DIR="$${VLLM_CACHE_ROOT}/mia-recipe/$${MIA_RECIPE_REVISION}"
        if [ ! -f "$${UPSTREAM_DIR}/.ready" ]; then
          curl -fLsS --retry 3 --max-time 180 \
            "https://codeload.github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark/tar.gz/$${MIA_RECIPE_REVISION}" \
            -o /tmp/mia-recipe.tar.gz
          printf '%s  %s\n' "$${MIA_RECIPE_SHA256}" /tmp/mia-recipe.tar.gz | sha256sum -c -
          mkdir -p "$${UPSTREAM_DIR}"
          tar -xzf /tmp/mia-recipe.tar.gz --strip-components=1 -C "$${UPSTREAM_DIR}"
          touch "$${UPSTREAM_DIR}/.ready"
        fi

        # The upstream start.sh manages host Docker. Adapt preparation and serving
        # here instead, applying upstream patchers inside this container.
        exec python3 -u - <<'PYTHON'
        #!/usr/bin/env python3
        # SPDX-License-Identifier: AGPL-3.0-or-later
        """Compose adaptation of the pinned MiaAI Lab single-Spark recipe."""
        import importlib.util
        import json
        import math
        import os
        from pathlib import Path
        import platform
        import shutil
        import signal
        import subprocess
        import sys

        GIB = 2**30
        ROOT = Path(os.environ['UPSTREAM_DIR'])


        def memory():
            values = {}
            for line in Path('/proc/meminfo').read_text().splitlines():
                key, value = line.split(':', 1)
                values[key] = int(value.split()[0]) * 1024 / GIB
            return values


        def budget(total, checkpoint_gib, context, sequences, reserve, kv_target):
            # Upstream estimates: 26.82 GiB PLE, 5.6 GiB runtime, 1.49 GiB MTP.
            fixed = checkpoint_gib - 26.82 + 5.6 + 1.49
            if total < 120 or fixed <= 0 or reserve < 26:
                raise ValueError('Requires a 128GB-class Spark and at least 26 GiB host reserve')
            fraction = math.floor(min(fixed + kv_target, total - reserve) / total * 1000) / 1000
            kv_available = total * fraction - fixed
            # FP8 compresses the main KV; auxiliary QSA caches remain BF16.
            kv_needed = context * sequences * 29482 * 0.58 / GIB
            if kv_available < kv_needed:
                raise ValueError(f'Estimated KV {kv_available:.2f} GiB cannot hold '
                                 f'{sequences} x {context} tokens ({kv_needed:.2f} GiB)')
            return fraction, kv_available


        def patch_runtime():
            package = Path(importlib.util.find_spec('vllm').origin).parent
            work = Path('/tmp/qwen38-spark-patches')
            files = work / 'files'
            shutil.copytree(ROOT / 'files', files, dirs_exist_ok=True)
            # Retain pristine inputs across restarts of the same container.
            mappings = {
                'ple_layer_patched.py': 'models/qwen3_8_flash_next/nvidia/ple_layer.py',
                'modelopt_patched.py': 'model_executor/layers/quantization/modelopt.py',
                'qsa_ops_patched.py': 'models/qwen3_8_flash_next/nvidia/ops/qsa.py',
                'qsa_nvidia_patched.py': 'models/qwen3_8_flash_next/nvidia/qsa.py',
                'mtp_patched.py': 'models/qwen3_8_flash_next/nvidia/mtp.py',
                'ple_offload/ple_offload_layer.py': 'model_executor/layers/ple_offload_layer.py',
                **{f'ple_offload/{name}.py': f'v1/ple_offload/{name}.py'
                   for name in ('connector', 'worker', 'protocol')},
            }
            for output, target in mappings.items():
                if output.startswith('ple_offload/'):
                    original = files / 'ple_offload/orig' / Path(output).name
                else:
                    original = files / (output + '.orig')
                original.parent.mkdir(parents=True, exist_ok=True)
                if not original.exists():
                    shutil.copy2(package / target, original)
            for name in ('ple_layer', 'modelopt_mxfp8', 'qsa_fp8_kv', 'mtp_draft_vocab', 'ple_offload'):
                subprocess.run([sys.executable, str(files / f'patch_{name}.py')], check=True)
            # Check all generated files before changing any package file.
            for output in mappings:
                compile((files / output).read_text(), output, 'exec')
            for output, target in mappings.items():
                shutil.copy2(files / output, package / target)


        def build_command(snapshot, fraction):
            context = int(os.environ['MAX_MODEL_LEN'])
            sequences = int(os.environ['MAX_NUM_SEQS'])
            # MTP=3 -> verification batches of 4, 8, ..., 32 tokens at 8 sequences.
            graph_sizes = list(range(4, 4 * sequences + 1, 4))
            return [
                'vllm', 'serve', str(snapshot),
                '--served-model-name', os.environ['SERVED_MODEL_NAME'],
                '--host', '0.0.0.0', '--port', '8000',
                '--tensor-parallel-size', '1',
                '--gpu-memory-utilization', f'{fraction:.3f}',
                '--max-model-len', str(context),
                '--max-num-seqs', str(sequences),
                '--max-num-batched-tokens', os.environ['MAX_NUM_BATCHED_TOKENS'],
                '--kv-cache-dtype', 'fp8',
                '--load-format', 'safetensors', '--safetensors-load-strategy', 'lazy',
                '--enable-chunked-prefill', '--distributed-executor-backend', 'mp',
                '--reasoning-parser', 'qwen3',
                '--enable-auto-tool-choice', '--tool-call-parser', 'qwen3_coder',
                '--speculative-config', json.dumps({'method': 'mtp', 'num_speculative_tokens': 3}),
                '--compilation-config', json.dumps({
                    'mode': 0, 'cudagraph_mode': 'FULL_DECODE_ONLY',
                    'cudagraph_capture_sizes': graph_sizes,
                }),
            ]


        def supervise(command):
            process = subprocess.Popen(command, start_new_session=True)
            stopping = False

            def stop(signum=signal.SIGTERM, frame=None):
                nonlocal stopping
                stopping = True
                if process.poll() is None:
                    process.send_signal(signum)

            signal.signal(signal.SIGTERM, stop)
            signal.signal(signal.SIGINT, stop)
            low_samples = 0
            try:
                while process.poll() is None and not stopping:
                    try:
                        process.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        mem = memory()
                        low = mem['MemAvailable'] < 6 or (mem['MemFree'] < 2 and mem['MemAvailable'] < 10)
                        low_samples = low_samples + 1 if low else 0
                        if low_samples >= 5:
                            print('Memory watchdog: stopping vLLM after sustained host memory pressure', flush=True)
                            stop()
                if process.poll() is None:
                    try:
                        process.wait(timeout=30)
                    except subprocess.TimeoutExpired:
                        os.killpg(process.pid, signal.SIGKILL)
                        process.wait()
                return 78 if low_samples >= 5 else process.returncode
            finally:
                if process.poll() is None:
                    os.killpg(process.pid, signal.SIGKILL)
                    process.wait()


        def main():
            if platform.machine() != 'aarch64':
                raise RuntimeError('This profile targets an ARM64 DGX Spark / GB10')
            gpu = subprocess.check_output(
                ['nvidia-smi', '--query-gpu=name', '--format=csv,noheader'], text=True)
            if len(gpu.strip().splitlines()) != 1 or 'GB10' not in gpu:
                raise RuntimeError(f'Expected one GB10 GPU, found: {gpu.strip()}')
            if memory()['MemTotal'] < 120:
                raise RuntimeError('This profile needs 128GB-class unified memory')
            context, sequences = int(os.environ['MAX_MODEL_LEN']), int(os.environ['MAX_NUM_SEQS'])
            if not 0 < context <= 262144 or sequences < 1:
                raise ValueError('Context must be within native 262144; sequences must be positive')
            patch_runtime()
            from huggingface_hub import snapshot_download
            print('Downloading/resuming pinned model snapshot in the external HF cache', flush=True)
            snapshot = Path(snapshot_download(
                repo_id=os.environ['MODEL_ID'], revision=os.environ['MODEL_REVISION'], max_workers=4))
            index = json.loads((snapshot / 'model.safetensors.index.json').read_text())
            weight_files = {snapshot / name for name in index['weight_map'].values()}
            checkpoint_gib = sum(path.stat().st_size for path in weight_files) / GIB
            mem = memory()
            fraction, kv = budget(mem['MemTotal'], checkpoint_gib, context, sequences,
                                  float(os.environ['HOST_RESERVE_GIB']), float(os.environ['KV_TARGET_GIB']))
            needed_available = mem['MemTotal'] * fraction + 5 + 4
            if mem['MemAvailable'] < needed_available:
                raise RuntimeError(f'Only {mem["MemAvailable"]:.1f} GiB available; '
                                   f'need {needed_available:.1f} GiB before starting')
            print(f'GPU budget: {fraction:.3f}; estimated KV: {kv:.2f} GiB; '
                  f'context: {context}; concurrent sequences: {sequences}', flush=True)

            packed = Path(os.environ['VLLM_CACHE_ROOT']) / 'ple_cache' / os.environ['MODEL_REVISION']
            # Publish a complete directory atomically, so interrupted first starts are resumable.
            if not (packed / 'READY').exists():
                packed.parent.mkdir(parents=True, exist_ok=True)
                staging = packed.with_name(packed.name + '.building')
                subprocess.run([sys.executable, str(ROOT / 'files/build_ple_packed_table.py'),
                                str(snapshot), str(staging)], check=True)
                (staging / 'READY').write_text(os.environ['MODEL_REVISION'] + '\n')
                staging.rename(packed)
            os.environ.update({
                'VLLM_PLE_PACKED_TABLE_DIR': str(packed),
                'HF_HUB_OFFLINE': '1', 'TRANSFORMERS_OFFLINE': '1',
            })
            return supervise(build_command(snapshot, fraction))


        if __name__ == '__main__':
            sys.exit(main())
        PYTHON
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120m

volumes:
  xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-hf-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-hf-cache
    external: true
  xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-vllm-cache:
    name: xtec-qwen38-flash-next-cuda-vram128-vllm-mia-nvfp4-mtp-64k-image-vllm-cache
    external: true
