# K2-Horizon-MoVA-36B-A4B native NVFP4 (4-bit) on a 128 GB-class NVIDIA GB10 host.
# The checkpoint is Transformers safetensors, served by a K2-capable vLLM nightly.
# The 128 GB unified-memory host can keep the checkpoint and a large KV cache resident.
services:
  k2-vllm:
    image: vllm/vllm-openai:nightly-8a728663c1c3eeace834a95f5654fa653cc1998c
    pull_policy: always
    container_name: k2_horizon_mova_36b_a4b_cuda_vram128_vllm_primitive_nvfp4_32k

    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - VLLM_CACHE_ROOT=/root/.cache/vllm
      - CUDA_VISIBLE_DEVICES=0

    volumes:
      - ./tokens.env:/run/secrets/tokens.env:ro
      - xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-hf-cache:/root/.cache/huggingface
      - xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-vllm-cache:/root/.cache/vllm

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45m

    ipc: host
    shm_size: "16gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -a
        . /run/secrets/tokens.env
        set +a
        if [ -n "$${HUGGINGFACE_ACCESS_TOKENS:-}" ]; then
          export HF_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
          export HUGGING_FACE_HUB_TOKEN="$${HUGGINGFACE_ACCESS_TOKENS}"
        fi

        exec vllm serve primitive-ai/K2-Horizon-MoVA-36B-A4B-NVFP4 \
          --host 0.0.0.0 \
          --port 8000 \
          --served-model-name active-model \
          --trust-remote-code \
          --dtype float16 \
          --max-model-len 32768 \
          --gpu-memory-utilization 0.92 \
          --max-num-seqs 8 \
          --reasoning-parser k2_horizon \
          --enable-auto-tool-choice \
          --tool-call-parser k2_horizon

volumes:
  xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-hf-cache:
    name: xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-hf-cache
    external: true
  xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-vllm-cache:
    name: xtec-k2-horizon-mova-36b-a4b-cuda-vram128-vllm-primitive-nvfp4-32k-vllm-cache
    external: true
