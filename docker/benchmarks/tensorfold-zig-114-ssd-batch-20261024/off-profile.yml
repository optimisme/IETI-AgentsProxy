name: ieti-qwen38-flash-next-tensorfold-114-ple
services:
  qwen-tensorfold-114-ple:
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        test "$$(cat /opt/ieti-native114/source-ready)" = "$${TF_PLE_PATCH_SHA256}"
        cd /opt/ieti-native114/install/native/bin
        sha256sum -c SHA256SUMS
        "$${NATIVE_BINARY}" --version
        echo "TF_FLASHNEXT_PLE_BATCH=$${TF_FLASHNEXT_PLE_BATCH}"
        MODEL_PATH="/root/.cache/huggingface/hub/models--TensorFold--Qwen3.8-Flash-Next-MLX-4bit-MTP/snapshots/$${MODEL_REVISION}"
        test -f "$$MODEL_PATH/config.json"
        options=()
        if [ "$${DRAFTS_ENABLED}" = 0 ]; then options+=(--no-drafts); fi
        if [ "$${VISION_ENABLED}" = 1 ]; then options+=(--vision --vision-max-images 1 --vision-image-tokens 4096); fi
        exec "$${NATIVE_BINARY}" serve "$$MODEL_PATH" \
          --host 0.0.0.0 --port 8000 --name "$${MODEL_ID}" \
          --context "$${CONTEXT_LENGTH}" --parallel "$${PARALLEL_STREAMS}" \
          --max-tokens 32768 --temperature 0.1 --top-p 0.95 --top-k 20 \
          --thinking --reasoning-effort low --thinking-budget 1024 \
          --prompt-cache-gib "$${TENSORFOLD_PROMPT_CACHE_GIB}" \
          "$${options[@]}" --no-update-check
    container_name: qwen38_flash_next_tensorfold_114_ple_cuda
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: 1
    environment:
      CONTEXT_LENGTH: "75000"
      DRAFTS_ENABLED: "1"
      LD_LIBRARY_PATH: /opt/ieti-tf114/tensorfold-1.1.4-linux-aarch64/lib
      MODEL_ID: TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
      MODEL_REVISION: 2b170fa6309d5d1ee380b35636075fac7945f286
      NATIVE_BINARY: /opt/ieti-native114/install/native/bin/tensorfold-native
      PARALLEL_STREAMS: "8"
      TENSORFOLD_CUDA_KERNELS: native
      TENSORFOLD_MEMORY_RESERVE_GIB: "10"
      TENSORFOLD_NO_UPDATE_CHECK: "1"
      TENSORFOLD_PROMPT_CACHE_GIB: "8"
      TF_FLASHNEXT_CHUNK: "1536"
      TF_FLASHNEXT_CONFIDENCE: "0.60"
      TF_FLASHNEXT_DRAFTS: "6"
      TF_FLASHNEXT_PLE_BATCH: "0"
      TF_PLE_PATCH_SHA256: 6d14c24477e2677824a5c59b75f240d02500d0d2a5bc37bc43139701b5e7c66c
      TF_REVISION: eab8582819688325e371907e4706e1c602b8a273
      VISION_ENABLED: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()
      timeout: 10s
      interval: 15s
      retries: 3
      start_period: 5m0s
    image: nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
    init: true
    ipc: host
    labels:
      com.ieti.inference: "true"
      com.ieti.profile: qwen38-flash-next-tensorfold-114-ple-batch-mlx-4bit-vision-128gb.yml
    networks:
      default: null
    platform: linux/arm64
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8000
        published: "8007"
        protocol: tcp
    pull_policy: missing
    restart: "no"
    stop_grace_period: 1m0s
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - type: volume
        source: upstream-runtime
        target: /opt/ieti-tf114
        read_only: true
        volume: {}
      - type: volume
        source: patched-runtime
        target: /opt/ieti-native114
        read_only: true
        volume: {}
      - type: volume
        source: checkpoint-cache
        target: /root/.cache/huggingface
        read_only: true
        volume: {}
networks:
  default:
    name: ieti-qwen38-flash-next-tensorfold-114-ple_default
volumes:
  checkpoint-cache:
    name: ieti-qwen38-flash-next-tensorfold-mlx-4bit-mtp-int8-ssd-vision-128gb-hf-cache
    external: true
  patched-runtime:
    name: ieti-native114-ple-build
    external: true
  upstream-runtime:
    name: ieti-tensorfold-114-runtime
    external: true
